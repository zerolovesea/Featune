# Package metadata. Created: 2026-09-21.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "featune"
version = "1.1.0"
description = "Semantic, controlled and reproducible feature engineering search"
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "pydantic>=2.10", "httpx>=0.27", "joblib>=1.3", "tabpfn==9.0.0", "torch>=2.5", "plotly>=5.20", "huggingface-hub>=0.23.0"]

[project.urls]
Source = "https://github.com/zerolovesea/Featune"
Documentation = "https://github.com/zerolovesea/Featune/blob/main/docs/en/guide.md"
Issues = "https://github.com/zerolovesea/Featune/issues"

[project.optional-dependencies]
visualization = []  # Compatibility alias; included in the default installation.
torch = []  # Compatibility alias; TabPFN installs PyTorch.
benchmark = ["openfe==0.0.12", "lightgbm>=4.0", "matplotlib>=3.8", "openpyxl>=3.1", "scikit-learn>=1.4,<1.6"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "ipywidgets>=8"]

[project.scripts]
featune = "featune.cli:main"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["featune"]

[tool.hatch.build.targets.sdist]
include = ["/featune", "/tests", "/examples", "/benchmarks/*.py", "/docs", "/README.md", "/README_en.md", "/PYPI.md", "/LICENSE", "/NOTICE", "/LICENSES", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.ipynb_checkpoints", "**/runs", "**/.DS_Store"]
